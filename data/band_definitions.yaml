    cognitive_correlate: deep_sleep
    gamma_crep: 0.05
    eta_setpoint: 0.05

  theta:
    range_hz: [4.0, 8.0]
    center_hz: 6.0
    cognitive_correlate: flow_meditation
    gamma_crep: 0.25
    eta_setpoint: 0.245
