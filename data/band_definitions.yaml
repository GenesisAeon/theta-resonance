      Γ_theta = Γ_AMOC = Γ_neural_criticality = 0.251.
      Triple homeostatic universality (GenesisAeon P27 prediction).

  alpha:
    range_hz: [8.0, 13.0]
    center_hz: 10.5
    cognitive_correlate: relaxed_attention
    gamma_crep: 0.35
    eta_setpoint: 0.357

  beta:
    range_hz: [13.0, 30.0]
    center_hz: 21.5
    cognitive_correlate: active_cognition
    gamma_crep: 0.55
    eta_setpoint: 0.503

  gamma:
    range_hz: [30.0, 80.0]
    center_hz: 55.0
