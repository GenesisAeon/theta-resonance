[project]
name = "theta-resonance"
version = "0.3.0"
description = "GenesisAeon Packages 27–29 — Brain Oscillation Bands (theta-resonance), Epigenetic Runtime Parameter Mutation (epi-sigillin) & Proof-of-Resonance Distributed Consensus (hikari-ledger)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Römer", email = "joberoemer@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "theta oscillations",
    "CREP",
    "UTAC",
    "criticality",
    "EEG",
    "cognitive neuroscience",
    "GenesisAeon",
    "entropy atlas",
    "flow state",
    "neural criticality",
    "epigenetics",
    "DNA methylation",
    "histone modification",
    "runtime parameter mutation",
    "adaptive systems",
    "proof-of-resonance",
    "distributed consensus",
    "Byzantine fault tolerance",
    "Hikari currency",
    "hikari-ledger",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mne = ["mne>=1.7"]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage    = "https://github.com/GenesisAeon/theta-resonance"
Repository  = "https://github.com/GenesisAeon/theta-resonance"
Issues      = "https://github.com/GenesisAeon/theta-resonance/issues"
Zenodo      = "https://doi.org/10.5281/zenodo.19645351"
Whitepaper  = "https://doi.org/10.5281/zenodo.19645351"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theta_resonance", "src/epi_sigillin", "src/hikari_ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--cov=theta_resonance --cov=epi_sigillin --cov=hikari_ledger --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit   = ["tests/*"]

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "diamond_setup.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "types-pyyaml>=6.0.12.20260518",
]
